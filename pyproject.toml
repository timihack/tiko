[project]
name = "tiko"
version = "0.1.0"
description = "A minimalist desktop clock, timer, and stopwatch"
requires-python = ">=3.12"
dependencies = [
    "PySide6",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]